<head>

  <meta property="og:title" content="202612冬季旅遊♡">

  <style>
    :root {
      --bg-paper: #F6F2EB;
      --card-bg: #FFFDF9;
      --earth-dark: #5C4D3C;
      --earth-mid: #8C7A6B;
      --earth-light: #D5C7B6;
      --earth-tint: #EFE8DD;
      --morandi-blue: #6B8299;
      --morandi-blue-dark: #4F6478;
      --morandi-blue-light: #DCE4EC;
      --accent-terracotta: #C27D63;
      --accent-sage: #8A9A86;
      --shadow-soft: 0 6px 20px rgba(92, 77, 60, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: "微軟正黑體", "Microsoft JhengHei", "Noto Sans TC", sans-serif;
      background-color: #E8E1D5;
      color: var(--earth-dark);
      line-height: 1.6;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .app-shell {
      width: 100%;
      max-width: 480px;
      background-color: var(--bg-paper);
      background-image: radial-gradient(#D5C7B6 0.8px, transparent 0.8px);
      background-size: 20px 20px;
      min-height: 100vh;
      position: relative;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.1);
      overflow-x: hidden;
    }

    /* 角色選擇彈窗 (儀式感開場) */
    #role-modal {
      position: fixed;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 480px;
      height: 100vh;
      background: rgba(92, 77, 60, 0.75);
      backdrop-filter: blur(6px);
      z-index: 2000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    #role-modal.hidden {
      display: none;
    }

    .role-card {
      background: var(--card-bg);
      border: 2px solid var(--earth-light);
      border-radius: 28px;
      padding: 28px 22px;
      width: 100%;
      text-align: center;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.2);
      animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes popIn {
      from { opacity: 0; transform: scale(0.88); }
      to { opacity: 1; transform: scale(1); }
    }

    .role-card h2 {
      font-size: 21px;
      color: var(--earth-dark);
      margin-bottom: 6px;
    }

    .role-card p {
      font-size: 13px;
      color: var(--earth-mid);
      margin-bottom: 20px;
    }

    .role-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    .role-btn {
      background: var(--bg-paper);
      border: 2px solid var(--earth-light);
      border-radius: 22px;
      padding: 14px 10px 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .role-btn:hover,
    .role-btn:active {
      background: var(--morandi-blue-light);
      border-color: var(--morandi-blue);
      transform: translateY(-3px);
      box-shadow: 0 6px 14px rgba(107, 130, 153, 0.2);
    }

    .role-btn:hover .role-illust,
    .role-btn:active .role-illust {
      transform: scale(1.06);
    }

    .role-illust {
      width: 72px;
      height: 72px;
      background: #FFFDF9;
      border-radius: 50%;
      border: 1.8px solid var(--earth-light);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      transition: transform 0.2s ease;
      box-shadow: inset 0 2px 6px rgba(92, 77, 60, 0.06);
    }

    .role-name {
      font-size: 16px;
      font-weight: 700;
      color: var(--earth-dark);
      letter-spacing: 1px;
    }

    .role-lock-hint {
      font-size: 11px;
      color: var(--accent-terracotta);
      margin-top: 16px;
    }

    /* 芬芬生日驚喜彈窗 */
    #bday-modal {
      position: fixed;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 480px;
      height: 100vh;
      background: rgba(92, 77, 60, 0.72);
      backdrop-filter: blur(5px);
      z-index: 3000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    #bday-modal.show {
      display: flex;
    }

    .bday-card {
      background: linear-gradient(180deg, #FFFDF9 0%, #FAF0EC 100%);
      border: 3px solid #E6B8A2;
      border-radius: 28px;
      padding: 28px 22px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 50px rgba(194, 125, 99, 0.35);
      animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .bday-title {
      font-size: 24px;
      font-weight: 700;
      color: var(--accent-terracotta);
      margin: 10px 0 6px;
      letter-spacing: 1px;
    }

    .bday-sub {
      font-size: 14px;
      color: var(--earth-dark);
      margin-bottom: 18px;
      line-height: 1.6;
    }

    .bday-close-btn {
      background: var(--accent-terracotta);
      color: #FFF;
      border: none;
      padding: 12px 32px;
      border-radius: 999px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      box-shadow: 0 6px 16px rgba(194, 125, 99, 0.35);
    }

    /* 封面主視覺 */
    #cover-screen {
      position: fixed;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 480px;
      height: 100vh;
      background: linear-gradient(180deg, #E3E9EE 0%, #F6F2EB 55%, #EFE6D8 100%);
      z-index: 1000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 40px 24px 50px;
      transition: transform 0.65s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.5s ease;
    }

    #cover-screen.hidden {
      transform: translate(-50%, -100%);
      opacity: 0;
      pointer-events: none;
    }

    .cover-badge {
      background-color: var(--card-bg);
      border: 1.5px solid var(--earth-light);
      color: var(--earth-mid);
      padding: 6px 18px;
      border-radius: 999px;
      font-size: 13px;
      letter-spacing: 2px;
      box-shadow: 0 2px 8px rgba(92, 77, 60, 0.06);
    }

    .cover-title-group {
      text-align: center;
      margin-top: 10px;
    }

    .cover-title {
      font-size: 26px;
      font-weight: 700;
      color: var(--earth-dark);
      letter-spacing: 1px;
      line-height: 1.4;
    }

    .cover-subtitle {
      font-size: 13px;
      color: var(--morandi-blue-dark);
      margin-top: 8px;
      letter-spacing: 1px;
    }

    .illustration-frame {
      width: 100%;
      max-width: 340px;
      background: var(--card-bg);
      border-radius: 28px;
      padding: 16px;
      border: 2px solid var(--earth-light);
      box-shadow: 0 12px 28px rgba(107, 130, 153, 0.15);
      position: relative;
    }

    .washi-tape {
      position: absolute;
      width: 90px;
      height: 24px;
      background-color: rgba(107, 130, 153, 0.35);
      top: -11px;
      left: 50%;
      transform: translateX(-50%) rotate(-2deg);
      border-left: 2px dashed rgba(255, 255, 255, 0.6);
      border-right: 2px dashed rgba(255, 255, 255, 0.6);
    }

    .start-btn {
      background-color: var(--morandi-blue);
      color: #FFFFFF;
      border: none;
      padding: 16px 42px;
      border-radius: 999px;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: 2px;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(107, 130, 153, 0.35);
      display: flex;
      align-items: center;
      gap: 10px;
      transition: transform 0.2s, background-color 0.2s;
      font-family: inherit;
    }

    .start-btn:active {
      transform: scale(0.96);
      background-color: var(--morandi-blue-dark);
    }

    /* 頂部導覽列（含問候語與天氣小工具） */
    .app-header {
      position: sticky;
      top: 0;
      z-index: 100;
      background-color: rgba(246, 242, 235, 0.95);
      backdrop-filter: blur(8px);
      padding: 10px 14px;
      border-bottom: 1.5px dashed var(--earth-light);
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      gap: 6px;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .cover-reopen-btn {
      background: var(--earth-tint);
      border: 1px solid var(--earth-light);
      color: var(--earth-mid);
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 8px;
      cursor: pointer;
      font-family: inherit;
    }

    .test-reset-btn {
      background: #FAF0EC;
      border: 1px solid var(--accent-terracotta);
      color: var(--accent-terracotta);
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 8px;
      cursor: pointer;
      font-family: inherit;
    }

    .header-right-widget {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .greeting-pill {
      background-color: var(--morandi-blue-light);
      color: var(--morandi-blue-dark);
      font-size: 12px;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 999px;
      border: 1px solid var(--morandi-blue);
    }

    .weather-pill {
      background-color: var(--card-bg);
      color: var(--earth-dark);
      font-size: 11.5px;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 999px;
      border: 1px solid var(--earth-light);
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
